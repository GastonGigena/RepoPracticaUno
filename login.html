<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="imagenes/icono_App_Itsc.png">
</head>

<body>
    <main>
        <section>

            <h3 class="subtitulo">Tecnicatura Superior en Desarrollo de Software - ITSC Villa El Libertador</h3>

            <h3 class="subtitulo-secundario">Iniciar Sesión</h3>

            <form action="procesar_login.html" method="post">
                <div>
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>

                <div>
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" required>
                </div>

                <div>
                    <button type="submit">Ingresar</button>
                </div>
            </form>

        </section>
    </main>
    <script>
        document.querySelector("form").addEventListener("submit", function (e) {
          e.preventDefault(); // evita el envío real si no hay backend
      
          // Aquí iría la validación (falsa para este ejemplo)
          // Suponiendo que el login es correcto:
          window.opener.location.href = "index.html"; // redirige la ventana principal
          window.close(); // cierra el popup
        });
      </script>
</body>

</html>
