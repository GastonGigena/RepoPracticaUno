<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <img src="imagenes/icono_App_Itsc.png" alt="LogoITSC">

    <h1 class="titulo-principal">Instituto Técnico Superior Córdoba</h1>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="Contactos.html">Contactos</a></li>
            <li><a href="alcance_titulo.html">Alcance de título</a></li>
            <li><a href="asignaturas.html">Asignaturas</a></li>
            <li><a href="login.html">Iniciar sesión</a></li>
        </ul>
    </nav>

    <h3 class="subtitulo">Tecnicatura Superior en Desarrollo de Software - ITSC Villa El Libertador</h3>

    <h3 class="subtitulo-secundario">Formulario de Contacto</h3>


    <form action="" method="post">
        <div>
            <label for="nombre">Ingrese su nombre:</label>
            <input type="text" name="nombre" id="nombre" required>
        </div>

        <div>
            <label for="apellido">Ingrese su apellido:</label>
            <input type="text" name="apellido" id="apellido" required>
        </div>

        <div>
            <h4>¿Estudia en la tecnicatura?</h4>
            <label for="estudia-si">
                <input type="radio" name="estudia" id="estudia-si" value="si"> Sí
            </label>
            <label for="estudia-no">
                <input type="radio" name="estudia" id="estudia-no" value="no"> No
            </label>
        </div>

        <div>
            <label for="selector">Año que cursa:</label>
            <select name="carrera" id="selector">
                <option value="1">Primer Año</option>
                <option value="2">Segundo Año</option>
                <option value="3">Tercer Año</option>
            </select>
        </div>

        <div>
            <label for="email">Ingrese su correo:</label>
            <input type="email" name="email" id="email" required>
        </div>

        <div>
            <h4>¿Cual es su consulta?:</h4>
            <textarea name="consulta" id="consulta" rows="5" cols="40"
                placeholder="Escriba su consulta aquí..."></textarea>
        </div>

        <div>
            <button type="submit">Enviar</button>
        </div>
    </form>

    <div class="banner">
        <img src="imagenes/banner.jpg" alt="imagen banner">
    </div>

</body>

</html>
